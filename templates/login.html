<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الشركاء | دار الخولي للعبايات (يوسف وبيبو)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        alexandria: ['Alexandria', 'sans-serif'],
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Alexandria', sans-serif; }
        .luxury-gradient {
            background: linear-gradient(135deg, #090d16 0%, #1e293b 50%, #0f172a 100%);
        }
    </style>
</head>
<body class="luxury-gradient min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-800">

    <!-- Decorative Glows -->
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-amber-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full relative z-10">
        
        <!-- Card -->
        <div class="bg-white rounded-3xl p-8 shadow-2xl border border-white/20">
            
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-2xl bg-slate-900 flex items-center justify-center text-amber-400 font-bold text-3xl mx-auto shadow-xl border border-amber-400/30 mb-4 group hover:scale-105 transition-transform font-cairo">
                    <span>خ</span>
                </div>
                <h1 class="text-2xl font-black text-slate-900 font-cairo">لوحة إدارة وحسابات الشركاء</h1>
                <p class="text-xs text-slate-500 mt-1">خاص بإدارة <strong>دار الخولي للعبايات</strong> (يوسف شعبان & بيبو)</p>
            </div>

            <!-- Error Notice (if wrong login) -->
            {% if error %}
            <div class="mb-6 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2 animate-shake">
                <i class="fa-solid fa-triangle-exclamation text-base"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="/login" method="POST" class="space-y-5">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم المستخدم (Username)</label>
                    <div class="relative">
                        <input type="text" name="username" required placeholder="أدخل اسم المستخدم..." autofocus
                               class="w-full bg-slate-50 border border-slate-300 focus:border-amber-500 focus:bg-white rounded-xl py-3 pr-10 pl-4 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 transition-all font-mono">
                        <span class="absolute right-3.5 top-3.5 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور (Password)</label>
                    <div class="relative">
                        <input type="password" id="passwordInput" name="password" required placeholder="••••••••" 
                               class="w-full bg-slate-50 border border-slate-300 focus:border-amber-500 focus:bg-white rounded-xl py-3 pr-10 pl-11 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 transition-all font-mono">
                        <span class="absolute right-3.5 top-3.5 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute left-3.5 top-3.5 text-slate-400 hover:text-slate-600 transition-colors">
                            <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-slate-900/10 hover:shadow-amber-500/20 transition-all flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>تسجيل الدخول إلى النظام</span>
                </button>

            </form>


            <!-- Back to Store -->
            <div class="mt-4 text-center">
                <a href="/" class="text-xs text-slate-400 hover:text-amber-600 transition-colors flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>العودة لصفحة المتجر الرئيسية</span>
                </a>
            </div>

        </div>

        <p class="text-center text-slate-400 text-xs mt-6">
            © 2026 متجر عبايات الخولي. وصول آمن ومحمي.
        </p>

    </div>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
